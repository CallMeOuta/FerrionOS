format = 1

[[case]]
name = "unlisted-missing-manifest"
mode = "config"
config = "unlisted-config.toml"
recipes = "fake-recipes"
expect = "missing-manifest"

[[case]]
name = "unknown-key"
mode = "repo"
package = "fixture-app"
path = "unknown-key.toml"
expect = "unknown-key"

[[case]]
name = "unknown-format"
mode = "repo"
package = "fixture-app"
path = "unknown-format.toml"
expect = "unsupported-format"

[[case]]
name = "missing-reason"
mode = "repo"
package = "fixture-app"
path = "missing-reason.toml"
expect = "missing-reason"

[[case]]
name = "never-capability"
mode = "repo"
package = "fixture-app"
path = "never-capability.toml"
expect = "forbidden-capability"

[[case]]
name = "unknown-capability"
mode = "repo"
package = "fixture-app"
path = "unknown-capability.toml"
expect = "unknown-capability"

[[case]]
name = "traversal-id"
mode = "outside"
