# Builds the FerrionOS Book (book/, mdBook) and publishes it with GitHub Pages
# at https://callmeouta.github.io/FerrionOS/. The repository's Pages source
# must be "GitHub Actions".
name: Book

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run in progress is left to finish, so a
# deployment is never cut off halfway; of the runs that wait, only the newest
# is kept.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # mdBook is pinned. To update it, change the version and the sha256 of
  # mdbook-v<version>-x86_64-unknown-linux-musl.tar.gz, which GitHub shows
  # beside the file on the release page.
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out book/
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: book

      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fL --retry 3 --retry-delay 1 -o "${RUNNER_TEMP}/mdbook.tar.gz" "${url}"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/mdbook.tar.gz" | sha256sum --check --quiet -
          tar -xzf "${RUNNER_TEMP}/mdbook.tar.gz" -C "${RUNNER_TEMP}" mdbook

      - name: Build the book
        run: |
          "${RUNNER_TEMP}/mdbook" build book

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
