[package]
name = "ferrion-file-chooser"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Out-of-process file chooser for FerrionOS Rune applications."

[features]
default = ["svg", "embedded-fonts", "tooling"]
svg = ["rune/svg"]
embedded-fonts = ["rune/embedded-fonts"]
tooling = ["rune/tooling"]
fault-hooks = ["rune/fault-hooks"]

[dependencies]
rune = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
