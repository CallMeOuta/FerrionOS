[workspace]
resolver = "2"
members = [
    "audiod",
    "config",
    "daemon",
    "dhcpd",
    "getty",
    "init",
    "initfs",
    "initfs/tools",
    "ipcd",
    "logd",
    "netstack",
    "ptyd",
    "ramfs",
    "randd",
    "scheme-utils",
    "udsd",
    "zerod",

    "inputd",

    "graphics-ipc",

    "selftests/virtio-fsd",
]

# Bootstrap needs it's own profile configuration; vendor/ holds patched crates.
exclude = ["bootstrap", "vendor"]

# Low-level Redox OS crates should be kept in sync using workspace dependencies
# Remember to also update bootstrap dependencies, those are not in the workspace
[workspace.dependencies]
acpi =  { git = "https://gitlab.redox-os.org/redox-os/acpi.git", branch = "redox-6.x" }
anyhow = "1"
bitflags = "2"
clap = "4"
drm = "0.15.0"
drm-ffi = "0.9.1"
drm-fourcc = "2.2.0"
drm-sys = "0.8.1"
env_logger = "0.11"
piaf = "0.7.0"
fdt = "0.2.0-alpha3"
futures = { version = "0.3", features = ["executor"] }
libc = "0.2.181"
log = "0.4"
libredox = "0.2.0"
orbclient = { git = "https://gitlab.redox-os.org/redox-os/orbclient.git" }
psf-rs = "2.2.0"
parking_lot = "0.12"
pico-args = "0.5"
plain = "0.2.3"
redox_event = "0.5.0"
redox-ioctl = { git = "https://gitlab.redox-os.org/redox-os/relibc.git" }
redox-log = { git = "https://gitlab.redox-os.org/redox-os/redox-log.git" }
redox-path = "0.4.1"
# redox-scheme = { version = "0.13.0", default-features = false }
redox-scheme = { git = "https://gitlab.redox-os.org/redox-os/redox-scheme.git", default-features = false }
redox_syscall = { version = "0.9.5",  features = ["std"] }
redox-rings = { git = "https://gitlab.redox-os.org/redox-os/redox-rings.git", features = ["userspace", "sync"] }
redox_termios = "0.1.4"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4.9"
smallvec = "1"
spin = "0.12"
static_assertions = "1.1.0"
thiserror = "2"
toml = "1"
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "allow" #TODO: set to deny when all public functions are documented

[workspace.lints.clippy]
cast_lossless = "warn" #TODO: set to deny when all instances tackled
missing_safety_doc = "warn" #TODO: set to deny when all safety documentation is completed
perf = { level = "deny", priority = -1 }
precedence = "deny"
unused_io_amount = "warn" #TODO: have an abstraction to irq file read/write, then set to deny

# smoltcp 0.14.0 with a hook for TCP initial sequence numbers, unpacked and patched into
# vendor/smoltcp by the FerrionOS recipe.
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }
