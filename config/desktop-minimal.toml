
include = ["minimal.toml"]

[general]
filesystem_size = 256

[packages]
orbdata = "source"
orbital = {}
orbterm = {}
orbutils = "source"

[[files]]
path = "/usr/share/ui/apps/60_viewer"
data = """
name=Viewer
binary=/usr/bin/viewer
icon=/usr/share/icons/apps/multimedia-photo-viewer.png
accept=*.bmp
accept=*.gif
accept=*.jpg
accept=*.jpeg
accept=*.png
accept=*.webp
author=Jeremy Soller
description=Image viewer
"""
postinstall = true

[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
requires_weak 10_net.target 20_audiod.service 30_console.target
nowait VT=3 orbital orblogin launcher
"""

[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = """
"""
