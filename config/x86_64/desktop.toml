# x86_64 desktop: the shared desktop image with five shells to choose from:
# bash, fish, zsh, Ion and Nushell. Nushell is the user's default; root and
# system scripts stay on Ion.
#
# Change a user's shell on a running system with
#   sudo usermod -s /usr/bin/fish user
# using any path listed in /etc/shells. To change it in the image instead, set
# shell in a [users.<name>] table of a config/my_<name>.toml (ignored by git)
# that includes this file; that is also how root and system scripts move to
# Nushell or another shell (scripts then start with #!/usr/bin/nu or similar).
#
# fish, zsh and Nushell build only for x86_64 today (the other
# config/<arch>/ci.toml files leave them out), so the other architectures offer
# bash and Ion. zsh's recipe is still work in progress: it prints getrusage()
# warnings until relibc gains times() support.

# tpm.toml: the TPM driver and attestation service, built and tested for x86_64 only.
# lockdown.toml: lockdown-probe, which checks that root reaches no raw hardware.
include = ["../desktop.toml", "../tpm.toml", "../lockdown.toml"]

[packages]
bash = {}
# Text filters for desktop scripts; these existing GNU ports are checked on x86_64.
# Keep the minimal and other-architecture images' package sets unchanged.
sed = {}
gawk = {}
# From source: the recipe sets the paths fish looks for its scripts in, which
# the prebuilt package lacks.
fish-shell = "source"
ion = {}
nushell = {}
zsh = {}
ferrion-cli = {}
# The program launcher of security roadmap S12: `ferrion-run --no-network PROGRAM`.
# It only takes access away (the network schemes, the sudo scheme, inherited descriptors)
# and is not setuid; scripts/vm-test.py ferrion-run checks it.
ferrion-run = {}
# Security roadmap S12: run as `user`, it checks that signals sent through process handles
# follow kill()'s permission rule; scripts/vm-test.py signal-handle runs it.
signal-handle-probe = {}
# Run as `user`, it checks that the namespace manager refuses fork requests whose lengths run
# past their end and keeps working; scripts/vm-test.py nsmgr-bounds runs it.
nsmgr-bounds-probe = {}
# Run as `user`, it checks that the display driver refuses dumb-buffer mappings and sizes outside
# a buffer or the driver's limits and keeps working; scripts/vm-test.py graphics-bounds runs it.
graphics-bounds-probe = {}
gpu-probe-context = {}
gpu-probe-blob = {}
gpu-probe-submit = {}
gpu-probe-syncobj = {}
gpu-probe-flip = {}
# Run as root (a `user` login may not create a scheme), it checks that a short read from a
# user-space scheme leaves the rest of the caller's buffer untouched; scripts/vm-test.py
# scheme-short-read runs it.
scheme-short-read-probe = {}
# Run as `user`, it checks that a zero-timeout poll that finds nothing leaves no event
# subscription behind; scripts/vm-test.py event-poll runs it.
event-poll-probe = {}
# Run as `user`, it checks that the network stack refuses calls whose buffers do not fit and
# keeps working; as root with `mac`, that network drivers refuse reads past their `mac`;
# scripts/vm-test.py net-calls and net-hardening run it.
net-call-probe = {}
# Run as root, it opens and closes the sound driver's shared ring N times (plans/audio.md AU1,
# issue #8); scripts/vm-test.py audio-ring runs it.
audio-probe = {}
# The Linux layer's LC1 (plans/linux-compat.md): linux-run starts a Linux program as the calling
# user, adding no right, through the kernel's foreign-call hook. foreign-call-probe checks it, and
# linux-hello-fixtures holds the four pinned hello programs; scripts/vm-test.py foreign-call and
# linux-hello run them.
linux-run = {}
foreign-call-probe = {}
linux-hello-fixtures = {}
# LC2: Debian's static busybox, the shell script and the output Linux gave for it;
# scripts/vm-test.py linux-busybox runs it under linux-run.
linux-busybox-fixtures = {}
# LC3 and LC4: the pinned Debian root (a read-only RedoxFS image) and linux-sessiond, a root service
# that serves it and a memory file system to each Linux session (widened access: see its recipe).
# linux-lc3-fixtures, linux-lc4-fixtures and linux-lc5-fixtures hold programs, scripts and Linux's
# output for them; scripts/vm-test.py linux-dynamic, linux-python and linux-net run them.
linux-root = {}
linux-sessiond = {}
linux-lc3-fixtures = {}
linux-lc4-fixtures = {}
linux-lc5-fixtures = {}
lock-probe = {}
update-index-probe = {}

# A ferrion-run profile, one per program: ferrion-run-probe is the test helper the
# ferrion-run check uses to show that a profile alone withholds the network.
[[files]]
path = "/etc/ferrion-run/ferrion-run-probe.toml"
data = """
version = 1
network = false
"""

# The login shells a user may pick.
[[files]]
path = "/etc/shells"
data = """
/usr/bin/bash
/usr/bin/fish
/usr/bin/ion
/usr/bin/nu
/usr/bin/zsh
"""

# Nushell runs every file in /usr/share/nushell/vendor/autoload after env.nu and
# config.nu, then the user's own autoload directory, where a file can turn the
# banner back on. FerrionOS starts quietly: no welcome banner.
[[files]]
path = "/usr/share/nushell/vendor/autoload/ferrion.nu"
data = """
$env.config.show_banner = false
"""

# Replaces the table from config/dev-accounts.toml whole, so the password is repeated.
[users.user]
password = ""
shell = "/usr/bin/nu"
