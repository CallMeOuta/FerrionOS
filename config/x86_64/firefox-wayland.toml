include = ["firefox-window.toml", "../wayland.toml"]

[packages]
cosmic-app-library = "ignore"
libcosmic-wayland = "ignore"
iced-wayland = "ignore"
smallvil = "ignore"
softbuffer-wayland = "ignore"
wayland-rs = "ignore"
winit-wayland = "ignore"
linux-busybox-fixtures = "ignore"

[[files]]
path = "/usr/bin/wayland-session"
mode = 0o755
data = """
#!/usr/bin/env bash
set -eu
# Preserve the socket chosen by cosmic-comp rather than guessing wayland-0.
printf 'export WAYLAND_DISPLAY=%q\\nexport XDG_RUNTIME_DIR=%q\\n' \
    "$WAYLAND_DISPLAY" "$XDG_RUNTIME_DIR" > /tmp/gtk-window-session
exec sleep 3600
"""
