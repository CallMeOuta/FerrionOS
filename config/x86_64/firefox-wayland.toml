include = ["firefox-window.toml", "../wayland.toml"]

[packages]
cosmic-comp = "source"
wayland-fd-probe = "source"
cosmic-app-library = "ignore"
libcosmic-wayland = "ignore"
iced-wayland = "ignore"
smallvil = "ignore"
softbuffer-wayland = "ignore"
wayland-rs = "ignore"
winit-wayland = "ignore"
linux-busybox-fixtures = "ignore"

[[files]]
path = "/usr/bin/wayland-session"
mode = 0o755
data = """
#!/usr/bin/env bash
set -eu
# Preserve the socket chosen by cosmic-comp rather than guessing wayland-0.
printf 'export WAYLAND_DISPLAY=%q\\nexport XDG_RUNTIME_DIR=%q\\n' \
    "$WAYLAND_DISPLAY" "$XDG_RUNTIME_DIR" > /tmp/gtk-window-session
exec sleep 3600
"""

[[files]]
path = "/usr/bin/orbital-wayland"
mode = 0o755
data = """
#!/usr/bin/env bash
set -e
unset DISPLAY
export COSMIC_BACKEND=winit
export HOME=/root
export RUST_BACKTRACE=full
export XCURSOR_THEME=Pop
export XDG_RUNTIME_DIR=/tmp/run/user/0
mkdir -p /tmp/run
mkdir -p /tmp/run/user
mkdir -p /tmp/run/user/0
glib-compile-schemas /usr/share/glib-2.0/schemas/
exec cosmic-comp wayland-session
"""
