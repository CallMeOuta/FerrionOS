# Configuration for demonstration

include = ["../desktop.toml"]

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 768

# Package settings
[packages]
# Games
dosbox = {}
freedoom = {}
prboom = {}
redox-games = {}

# Demos
pixelcannon = {}

# MIDI
freepats = {}

[[files]]
path = "/home/user/Welcome.txt"
data = """
##############################################################################
#                                                                            #
#                            Welcome to FerrionOS!                           #
#                                                                            #
# FerrionOS is an operating system written in Rust, a language with focus on #
# safety and high performance. FerrionOS, following the microkernel design,  #
# aims to be secure, usable, and free. FerrionOS is inspired by previous     #
# kernels and operating systems, such as SeL4, MINIX, Plan 9, and BSD.       #
#                                                                            #
# FerrionOS _is not_ just a kernel, it's a full-featured Operating System,   #
# providing packages (memory allocator, file system, display manager, core   #
# utilities, etc.) that together make up a functional and convenient         #
# operating system. You can loosely think of it as the GNU or BSD ecosystem, #
# but in a memory safe language and with modern technology.                  #
#                                                                            #
# Documentation: https://callmeouta.github.io/FerrionOS/                     #
# Source and issues: https://github.com/CallMeOuta/FerrionOS                 #
#                                                                            #
##############################################################################
"""
