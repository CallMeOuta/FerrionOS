
[[files]]
path = "/etc/issue"
data = """
########
##
##

######
##
##

########## FerrionOS #########
# Login with the following:  #
# `user`                     #
# `root`:`password`          #
##############################
 
"""

[users.root]
password = "password"
uid = 0
gid = 0
shell = "/usr/bin/ion"

[users.user]
password = ""
shell = "/usr/bin/ion"

[groups.sudo]
gid = 1
members = ["user"]
