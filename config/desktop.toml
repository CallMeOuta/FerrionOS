
include = ["server.toml", "desktop-minimal.toml"]

[general]
filesystem_size = 650

[packages]
cosmic-edit = {}
cosmic-files = {}
cosmic-icons = {}
cosmic-term = {}
dejavu = {}
file = {}
freefont = {}
hicolor-icon-theme = {}
installer-gui = {}
libxkbcommon = "source"
noto-sans-cjk = {}
patchelf = {}
pop-icon-theme = {}
shared-mime-info = {}
orbterm = "ignore"

[[files]]
path = "/usr/share/ui/apps/redox-installer-gui"
data = """
name=FerrionOS Installer
category=System
binary=/usr/bin/redox_installer_gui
icon=/usr/share/icons/Pop/48x48/apps/system-os-installer.svg
author=Jeremy Soller
description=GUI installer for FerrionOS
"""
postinstall = true
