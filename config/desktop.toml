# Default build system configuration

# desktop-minimal.toml comes last so that its override of minimal.toml's
# 30_console_switch wins over the copy server.toml brings in again.
include = ["server.toml", "desktop-minimal.toml"]

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 650

# Package settings
[packages]
cosmic-edit = {}
cosmic-files = {}
cosmic-icons = {}
cosmic-term = {}
dejavu = {}
file = {}
freefont = {}
hicolor-icon-theme = {}
installer-gui = {}
netsurf = {}
patchelf = {}
pop-icon-theme = {}
shared-mime-info = {}
# orbterm from desktop-minimal should be ignored
orbterm = "ignore"
