# Minimal configuration

include = ["base.toml", "dev-accounts.toml"]

# General settings
[general]
# Filesystem size in MiB
filesystem_size = 196

# Package settings
[packages]
ca-certificates = {}
coreutils = {}
# Carries the tar gzip and -C fixes in ferrion-tar-options.patch.
extrautils = "source"
ion = {}
pkgutils = {}
kibi = {}
uutils-grep = {}
uutils-procps = {}

[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = """
requires_weak 30_console.target
inputd -A 2
"""
