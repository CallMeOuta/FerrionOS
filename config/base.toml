# Base configuration: This configuration is meant to be included by
# other configurations rather than use directly. It is the greatest
# common divisor of all other configurations and misses several
# parts necessary to create a bootable system.

# General settings
[general]
# Do not prompt if settings are not defined
prompt = false

[packages]
# FerrionOS carries patches for these components (recipes/core/<name>/*.patch), so they
# are always built from source: with REPO_BINARY=1 the package server would
# otherwise supply upstream's builds without the patches.
base = "source"
bootloader = "source"
kernel = "source"
libgcc = {}
libstdcxx = {}
netdb = {}
netutils = {}
relibc = "source"
userutils = "source"
uutils = {}

## Configuration files
[[files]]
path = "/etc/login_schemes.toml"
data = """
[user_schemes.root]
# `namespace:scheme-create` names a right, not a scheme: root's logins may create schemes,
# which the installer needs to mount the target disk (base ferrion-scheme-create-fork.patch).
# Programs root starts in a namespace of their own, such as ferrion-run's, do not get it.
schemes = ["*", "namespace:scheme-create"]
[user_schemes.user]
schemes = [
  # Kernel schemes
  "debug",
  "event",
  "memory",
  "pipe",
  "time",
  "sys",
  # Base schemes
  "rand",
  "null",
  "zero",
  "log",
  # Network schemes
  "ip",
  "icmp",
  "tcp",
  "udp",
  # IPC schemes
  "shm",
  "chan",
  "uds_stream",
  "uds_dgram",
  # File schemes
  "file",
  # Display schemes
  "display*",
  # Other schemes
  "proc",
  "pty",
  "sudo",
  "audio",
  "orbital",
]
"""

[[files]]
path = "/etc/hostname"
data = "ferrion"

# Replaces the netdb package's /etc/hosts, whose last line names the upstream
# hostname; written after the packages (postinstall) so that it wins.
[[files]]
path = "/etc/hosts"
data = """
#
# /etc/hosts: static lookup table for host names
#

#<ip-address>	<hostname.domain.org>	<hostname>
127.0.0.1	localhost.localdomain	localhost
::1		localhost.localdomain	localhost
127.0.0.1	ferrion.localdomain	ferrion

# End of file
"""
postinstall = true

## Default net configuration (optimized for QEMU)
# dhcpd replaces this bootstrap fallback with the lease's preferred DNS server.
[[files]]
path = "/etc/net/dns"
data = """
9.9.9.9
"""

[[files]]
path = "/etc/net/ip"
data = """
10.0.2.15
"""

[[files]]
path = "/etc/net/ip_router"
data = """
10.0.2.2
"""

[[files]]
path = "/etc/net/ip_subnet"
data = """
255.255.255.0
"""

# https://www.freedesktop.org/software/systemd/man/latest/os-release.html
[[files]]
path = "/usr/lib/os-release"
data = """
PRETTY_NAME="FerrionOS 0.9.0"
NAME="FerrionOS"
VERSION_ID="0.9.0"
VERSION="0.9.0"
ID="ferrionos"
# os-release's field for derivatives: tools that look for redox-os still match.
ID_LIKE="redox-os"

HOME_URL="https://github.com/CallMeOuta/FerrionOS"
DOCUMENTATION_URL="https://callmeouta.github.io/FerrionOS/"
BUG_REPORT_URL="https://github.com/CallMeOuta/FerrionOS/issues"
"""
# VARIANT and BUILD_ID are appended by redox_installer when creating images.

[[files]]
path = "/etc/os-release"
data = "../usr/lib/os-release"
symlink = true

[[files]]
path = "/etc/pkg.d/50_redox"
data = "https://static.redox-os.org/pkg"

