include = ["desktop-minimal.toml"]

[general]
filesystem_size = 512

[packages]
ferrion-wm-smoke = "source"
wayland-probe = "source"
pixman = {}
libxkbcommon = {}
xkeyboard-config = {}
libffi = {}

[[files]]
path = "/usr/lib/init.d/20_orbital"
data = """
requires_weak 30_console.target
nowait VT=3 XDG_RUNTIME_DIR=/tmp/ferrion-wm ferrion-wm-smoke
"""
