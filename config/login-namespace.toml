
include = ["minimal.toml"]

[users.netless]
password = "netless-test"
shell = "/usr/bin/ion"

[[files]]
path = "/etc/login_schemes.toml"
data = """
[user_schemes.root]
schemes = ["*", "namespace:scheme-create"]
[user_schemes.user]
schemes = [
  "debug", "event", "memory", "pipe", "time", "sys",
  "rand", "null", "zero", "log",
  "ip", "icmp", "tcp", "udp", "netstatus",
  "shm", "chan", "uds_stream", "uds_dgram",
  "file",
  "display*",
  "proc", "pty", "sudo", "audio", "orbital",
]
[user_schemes.netless]
schemes = [
  "debug", "event", "memory", "pipe", "time", "sys",
  "rand", "null", "zero", "log",
  "shm", "chan", "uds_stream", "uds_dgram",
  "file",
  "display*",
  "proc", "pty", "sudo", "audio", "orbital",
]
"""
