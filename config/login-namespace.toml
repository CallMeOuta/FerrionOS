# Login namespace check (security roadmap S12).
#
# Adds `netless`, an account with a password whose entry in
# /etc/login_schemes.toml leaves out the network schemes (ip, icmp, tcp, udp).
# `login` must enter that namespace for an account with a password just as it
# does for one without (recipes/core/userutils/ferrion-login-namespace.patch).
#
# Checked by `scripts/vm-test.py login-namespace --config login-namespace`.

include = ["minimal.toml"]

# Test credential for this check only: an image built from this config never
# leaves the build machine.
[users.netless]
password = "netless-test"
shell = "/usr/bin/ion"

# Replaces base.toml's file whole: `root` and `user` keep base.toml's lists, and
# `netless` gets `user`'s list without the network schemes.
[[files]]
path = "/etc/login_schemes.toml"
data = """
[user_schemes.root]
schemes = ["*", "namespace:scheme-create"]
[user_schemes.user]
schemes = [
  "debug", "event", "memory", "pipe", "time", "sys",
  "rand", "null", "zero", "log",
  "ip", "icmp", "tcp", "udp",
  "shm", "chan", "uds_stream", "uds_dgram",
  "file",
  "display*",
  "proc", "pty", "sudo", "audio", "orbital",
]
[user_schemes.netless]
schemes = [
  "debug", "event", "memory", "pipe", "time", "sys",
  "rand", "null", "zero", "log",
  "shm", "chan", "uds_stream", "uds_dgram",
  "file",
  "display*",
  "proc", "pty", "sudo", "audio", "orbital",
]
"""
