[package]
description = "Resolve and print binary or shared library dependencies (ldd implementation in Rust)"

[source]
git = "https://github.com/zatrazz/rldd"
rev = "e147c156fb8e4be87fbd36ae84be88baf90f03cc"
patches = [ "redox.patch" ]

[build]
template = "custom"
script = """
DYNAMIC_INIT
cookbook_cargo

cp ${COOKBOOK_RECIPE}/ldd.sh ${COOKBOOK_STAGE}/usr/bin/ldd
chmod +x ${COOKBOOK_STAGE}/usr/bin/ldd
"""
