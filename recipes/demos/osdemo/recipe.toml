[package]
description = "Mesa3D offscreen rendering through EGL with Orbital windowing"
dependencies = ["mesa"]

[build]
template = "custom"
dependencies = [
    "liborbital",
    "libglvnd",
    "mesa-glu",
    "zlib"
]
script = """
DYNAMIC_INIT

cp "${COOKBOOK_RECIPE}/osdemo.c" ./osdemo.c
${CXX} -O2 -I "${COOKBOOK_SYSROOT}/include" $LDFLAGS osdemo.c -o osdemo \
    -lorbital $("${PKG_CONFIG}" --libs glu opengl egl) -lz
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
cp -v "osdemo" "${COOKBOOK_STAGE}/usr/bin/osdemo"
"""
