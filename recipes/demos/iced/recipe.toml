[package]
description = "Examples from Iced GUI library"

[source]
git = "https://github.com/pop-os/iced"
rev = "300fa97ee2bcc2a39239ecc780eee0bf31a82b9f"
patches = [
    "redox.patch"
]

[build]
template = "cargo"
cargopackages = [
    "arc",
    "bezier_tool",
    "changelog",
    "clock",
    "color_palette",
    "combo_box",
    "counter",
    "custom_quad",
    "custom_widget",
    "download_progress",
    "events",
    "exit",
    "gallery",
    "game_of_life",
    "geometry",
    "layout",
    "lazy",
    "list",
    "loading_spinners",
    "markdown",
    "modal",
    "multitouch",
    "pane_grid",
    "pick_list",
    "pokedex",
    "progress_bar",
    "qr_code",
    "screenshot",
    "sierpinski_triangle",
    "slider",
    "solar_system",
    "stopwatch",
    "styling",
    "svg",
    "table",
    "the_matrix",
    "todos",
    "tooltip",
    "tour",
    "vectorial_text",
    "websocket",
]
cargopackagesprefixed = true
dependencies = [
    "openssl3",
]
