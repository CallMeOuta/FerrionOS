[package]
description = "Checks that signals sent through process handles follow kill()'s permission rule"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} -O2 -Wall -o "${COOKBOOK_STAGE}/usr/bin/signal-handle-probe" "${COOKBOOK_RECIPE}/signal-handle-probe.c"
"""
