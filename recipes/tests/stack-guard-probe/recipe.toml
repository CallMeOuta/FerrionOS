[package]
description = "Checks per-process random stack guard and stack-smash abort"

[build]
template = "custom"
script = """
mkdir -p "${COOKBOOK_STAGE}/usr/bin" "${COOKBOOK_STAGE}/usr/lib/stack-guard-probe"
${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fstack-protector-strong \
    -c "${COOKBOOK_RECIPE}/probe.c" -o probe-static.o
${CC} probe-static.o ${LDFLAGS} \
    -o "${COOKBOOK_STAGE}/usr/bin/stack-guard-probe-static"

DYNAMIC_INIT
${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fPIC -fstack-protector-strong \
    -c "${COOKBOOK_RECIPE}/dso.c" -o dso.o
${CC} -shared dso.o ${LDFLAGS} -o libstack-guard-probe.so

${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fno-pie -fstack-protector-strong -DWITH_DSO \
    -c "${COOKBOOK_RECIPE}/probe.c" -o probe-dynamic.o
${CC} -no-pie probe-dynamic.o -L. -lstack-guard-probe \
    -Wl,-rpath,/usr/lib/stack-guard-probe ${LDFLAGS} \
    -o stack-guard-probe-dynamic

${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fPIE -fstack-protector-strong -DWITH_DSO \
    -c "${COOKBOOK_RECIPE}/probe.c" -o probe-pie.o
${CC} -pie probe-pie.o -L. -lstack-guard-probe \
    -Wl,-rpath,/usr/lib/stack-guard-probe ${LDFLAGS} \
    -o stack-guard-probe-pie

cp libstack-guard-probe.so "${COOKBOOK_STAGE}/usr/lib/stack-guard-probe/"
cp stack-guard-probe-dynamic stack-guard-probe-pie "${COOKBOOK_STAGE}/usr/bin/"
"""
