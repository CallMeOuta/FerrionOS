[package]
description = "Checks per-process random stack guard and stack-smash abort"

[build]
template = "custom"
script = """
mkdir -p "${COOKBOOK_STAGE}/usr/bin" "${COOKBOOK_STAGE}/usr/lib/stack-guard-probe"
${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fstack-protector-strong \
    "${COOKBOOK_RECIPE}/probe.c" ${LDFLAGS} \
    -o "${COOKBOOK_STAGE}/usr/bin/stack-guard-probe-static"

DYNAMIC_INIT
${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fPIC -shared -fstack-protector-strong \
    "${COOKBOOK_RECIPE}/dso.c" ${LDFLAGS} -o libstack-guard-probe.so

${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fno-pie -no-pie -fstack-protector-strong -DWITH_DSO \
    "${COOKBOOK_RECIPE}/probe.c" -L. -lstack-guard-probe \
    -Wl,-rpath,/usr/lib/stack-guard-probe ${LDFLAGS} \
    -o stack-guard-probe-dynamic

${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra -fPIE -pie -fstack-protector-strong -DWITH_DSO \
    "${COOKBOOK_RECIPE}/probe.c" -L. -lstack-guard-probe \
    -Wl,-rpath,/usr/lib/stack-guard-probe ${LDFLAGS} \
    -o stack-guard-probe-pie

cp libstack-guard-probe.so "${COOKBOOK_STAGE}/usr/lib/stack-guard-probe/"
cp stack-guard-probe-dynamic stack-guard-probe-pie "${COOKBOOK_STAGE}/usr/bin/"
"""
