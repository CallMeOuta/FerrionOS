[package]
description = "Checks cross-process GPU blob PRIME sharing, fences, read-only enforcement, isolation, and producer kill survival"
dependencies = ["mesa"]

[build]
template = "custom"
dependencies = ["mesa", "libvulkan"]
script = """
DYNAMIC_INIT
${CC} ${CFLAGS} -std=c11 -O2 -Wall -Wextra "${COOKBOOK_RECIPE}/main.c" \
    ${LDFLAGS} $("${PKG_CONFIG}" --cflags --libs vulkan) -o gpu-probe-share
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
cp gpu-probe-share "${COOKBOOK_STAGE}/usr/bin/"
"""
