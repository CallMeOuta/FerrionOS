[package]
description = "Checks GPU command submission, fence descriptors, poll readiness and waits"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -O2 -Wall -Wextra -o "${COOKBOOK_STAGE}/usr/bin/gpu-probe-submit" \
    "${COOKBOOK_RECIPE}/main.c" "${COOKBOOK_RECIPE}/submit.c" ${LDFLAGS}
"""
