[package]
description = "Checks host-visible GPU blob creation, mapping, readback, unmap, and close"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -O2 -Wall -Wextra -o "${COOKBOOK_STAGE}/usr/bin/gpu-probe-blob" \
    "${COOKBOOK_RECIPE}/main.c" "${COOKBOOK_RECIPE}/blob.c" ${LDFLAGS}
"""
