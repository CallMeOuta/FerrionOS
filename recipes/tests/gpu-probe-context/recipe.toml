[package]
description = "Checks that a render handle on the GPU opens a Venus context and refuses display requests"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -O2 -Wall -Wextra -o "${COOKBOOK_STAGE}/usr/bin/gpu-probe-context" \
    "${COOKBOOK_RECIPE}/main.c" "${COOKBOOK_RECIPE}/context.c" ${LDFLAGS}
"""
