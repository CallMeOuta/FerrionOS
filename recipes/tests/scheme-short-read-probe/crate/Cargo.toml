[package]
name = "scheme-short-read-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Checks that a short read from a user-space scheme leaves the rest of the caller's buffer untouched"
publish = false

[dependencies]
libc = "0.2.191"
libredox = "0.2.0"
redox_syscall = "0.9.5"
redox-scheme = { git = "https://gitlab.redox-os.org/redox-os/redox-scheme.git", rev = "3514d5696fb8cbbe7d517d37d3074d7cd5cfdded" }
