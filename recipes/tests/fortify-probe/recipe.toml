[package]
description = "Checks _FORTIFY_SOURCE=2 bounds checking via __*_chk functions"

[build]
template = "custom"
script = """
mkdir -p "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -std=c11 -O2 -D_FORTIFY_SOURCE=2 -fno-stack-protector -Wall -Wextra \
    "${COOKBOOK_RECIPE}/fortify-probe.c" ${LDFLAGS} \
    -o "${COOKBOOK_STAGE}/usr/bin/fortify-probe-static"

DYNAMIC_INIT
${CC} ${CFLAGS} -std=c11 -O2 -D_FORTIFY_SOURCE=2 -fno-stack-protector -Wall -Wextra \
    "${COOKBOOK_RECIPE}/fortify-probe.c" ${LDFLAGS} \
    -o "${COOKBOOK_STAGE}/usr/bin/fortify-probe-dynamic"
"""
