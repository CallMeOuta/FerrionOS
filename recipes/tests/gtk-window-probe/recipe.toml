[package]
description = "Checks a GTK window's pixels and normal exit on Orbital"

[build]
template = "custom"
dependencies = ["gtk3"]
dev-dependencies = ["shared-mime-info"]
script = """
DYNAMIC_INIT
export PKG_CONFIG_PATH="${COOKBOOK_SYSROOT}/usr/share/pkgconfig:${PKG_CONFIG_PATH}"
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -O2 -Wall -Wextra $(pkg-config --cflags gtk+-3.0) \
    -o "${COOKBOOK_STAGE}/usr/bin/gtk-window-probe" "${COOKBOOK_RECIPE}/main.c" \
    ${LDFLAGS} $(pkg-config --libs gtk+-3.0)
"""
