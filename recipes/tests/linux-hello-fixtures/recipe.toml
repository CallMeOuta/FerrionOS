[package]
description = "Static Linux hello programs for the Linux layer's checks"

[build]
template = "custom"
script = """
dest="${COOKBOOK_STAGE}/usr/share/linux-hello"
mkdir -pv "${dest}"
cd "${COOKBOOK_RECIPE}/files"
sha256sum -c SHA256SUMS
cp -v hello-raw hello-musl-static hello-glibc-static hello-go SHA256SUMS \
    expected.stdout expected.stderr expected.status "${dest}/"
chmod 0755 "${dest}"/hello-*
cd "${dest}"
sha256sum -c SHA256SUMS
"""
