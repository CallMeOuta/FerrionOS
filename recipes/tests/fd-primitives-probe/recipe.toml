# Public eventfd/timerfd regression; static linkage exercises the image's relibc.
# Run with scripts/vm-test.py fd-primitives on an image containing this package
# and fdobjd. Signalfd is deferred and is not reported as passing by this probe.
[package]
description = "Checks eventfd and timerfd I/O, readiness and descriptor sharing"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} -std=c11 -O2 -Wall -Wextra -static -o "${COOKBOOK_STAGE}/usr/bin/fd-primitives-probe" "${COOKBOOK_RECIPE}/fd-primitives-probe.c"
"""
