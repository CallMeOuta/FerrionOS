[package]
description = "Checks DRM connector types, IDs, and EDID mode lists on a display handle"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
${CC} ${CFLAGS} -O2 -Wall -Wextra -o "${COOKBOOK_STAGE}/usr/bin/display-drm-probe" \
    "${COOKBOOK_RECIPE}/main.c" ${LDFLAGS}
"""
