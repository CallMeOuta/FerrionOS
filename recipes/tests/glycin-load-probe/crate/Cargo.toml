[package]
name = "glycin-load-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
async-io = "2.3.2"
gio = { version = "0.22.0", features = ["v2_62"] }
glycin = { version = "4.0.5", default-features = false, features = ["async-io"] }
glycin-utils = { version = "5.0.1", default-features = false, features = ["async-io", "loader-utils", "external"] }
