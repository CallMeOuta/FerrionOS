[package]
description = "Minimal terminal text editor like GNU nano, written in Rust"

[source]
git = "https://github.com/ilai-deutel/kibi"
rev = "805819d57228cf4f2b64a7313f6d473348a4a844"

[build]
template = "custom"
script = """
DYNAMIC_INIT
mkdir -pv "${COOKBOOK_STAGE}"/usr/share/kibi
cp -rv "${COOKBOOK_SOURCE}"/syntax.d "${COOKBOOK_STAGE}"/usr/share/kibi
cookbook_cargo
"""
