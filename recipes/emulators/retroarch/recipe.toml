[package]
description = "Official libretro frontend"

[source]
git = "https://github.com/jackpot51/retroarch.git"
shallow_clone = true
script = """
./fetch-submodules.sh
"""

[build]
template = "custom"
dependencies = [
    "liborbital",
    "libretro-super",
    "mesa",
    "openssl3",
    "sdl2",
    "zlib",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./


COOKBOOK_CONFIGURE_FLAGS=(
    --host="${TARGET}"
    --prefix="/"
    --disable-builtinzlib
    --disable-discord
    --disable-netplaydiscovery
    --disable-thread_storage
    --disable-threads
    --enable-sdl2
    --enable-ssl
    --enable-zlib
)
cookbook_configure
"""
