[package]
description = "RISC-V Virtual Machine / Emulator"

[source]
git = "https://github.com/LekKit/RVVM.git"

[build]
template = "custom"

dependencies = [
    "sdl1",
    "liborbital",
]

script = """
DYNAMIC_INIT
export BUILDDIR="${COOKBOOK_BUILD}"
export DESTDIR="${COOKBOOK_STAGE}"
export USE_SDL=1
export OS=Redox

"${COOKBOOK_MAKE}" install -C "${COOKBOOK_SOURCE}"
"""
