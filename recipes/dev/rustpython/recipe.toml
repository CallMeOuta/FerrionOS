[package]
description = "Python interpreter written in Rust"

[source]
git = "https://github.com/RustPython/RustPython"
rev = "3b48dcc7c1549f598bd9a96d2ee97b1cb83f910b"
shallow_clone = true
patches = [
  "redox.patch"
]

[build]
dependencies = [
  "openssl3",
  "zlib",
]
template = "custom"
script = """
DYNAMIC_INIT

export BUILDTIME_RUSTPYTHONPATH=/usr/lib/rustpython
export OPENSSL_DIR="${COOKBOOK_SYSROOT}"
export ZLIB_STATIC=1
if [ "${COOKBOOK_DYNAMIC}" != "1" ]; then
  export OPENSSL_STATIC=1
fi
cookbook_cargo --features ssl
mkdir -p "${COOKBOOK_STAGE}/usr/lib"
rsync -aE \
  --exclude 'test/' \
  --exclude '__pycache__/' \
  --exclude '*.pyc' \
  --exclude '/README.md' \
  "${COOKBOOK_SOURCE}"/Lib/ "${COOKBOOK_STAGE}/usr/lib/rustpython"
"""
