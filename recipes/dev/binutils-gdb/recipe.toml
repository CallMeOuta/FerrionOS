[package]
description = "GNU Binutils version of GDB debugger"

[source]
git = "https://gitlab.redox-os.org/redox-os/binutils-gdb"
branch = "redox-2.43.1"
shallow_clone = true

[build]
template = "custom"
dependencies = [
  "libgmp",
  "libmpfr",
  "target:readline",
]
script = """
DYNAMIC_INIT

if [ "${COOKBOOK_HOST_SYSROOT}" = "/usr" ]; then
COOKBOOK_CONFIGURE_FLAGS=( --prefix=/usr --host="${GNU_TARGET}" --program-prefix="${COOKBOOK_CROSS_GNU_TARGET:-$GNU_TARGET}-" )
else 
COOKBOOK_CONFIGURE_FLAGS+=( --with-system-readline )
fi

COOKBOOK_CONFIGURE_FLAGS+=(
    --target="${COOKBOOK_CROSS_GNU_TARGET:-$GNU_TARGET}"
    --enable-default-hash-style=gnu
    --enable-deterministic-archives
    --disable-werror
)

cookbook_configure
"""