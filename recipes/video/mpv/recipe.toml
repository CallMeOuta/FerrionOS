[package]
description = "Media player and library"

[source]
git = "https://github.com/mpv-player/mpv.git"
rev = "b0841e8c4d156b8403dc1876c4cbd9011eb583f3"
patches = [
    "ferrion-accept-fallback.patch",
    "ferrion-ao.patch",
    "ferrion-wayland-shm.patch",
]

[build]
template = "custom"
dependencies = [
    "ffmpeg",
    "libass",
    "libglvnd",
    "libiconv",
    "libplacebo",
    "libwayland",
    "libxkbcommon",
    "zlib",
]
dev-dependencies = [
    "linux-input-event-codes",
    "wayland-protocols",
]
script = """
DYNAMIC_INIT

cat > wayland_scanner_cross.txt <<'EOF'
[binaries]
wayland-scanner = '/usr/bin/wayland-scanner'
EOF

cookbook_meson \
    --cross-file wayland_scanner_cross.txt \
    -Dgpl=false \
    -Dauto_features=disabled \
    -Dgl=enabled \
    -Degl=enabled \
    -Degl-wayland=enabled \
    -Dlua=disabled \
    -Dbuild-date=false \
    -Dcplayer=true \
    -Dlibmpv=true \
    -Dferrion-audio=enabled \
    -Dwayland=enabled \
    -Diconv=enabled \
    -Dzlib=enabled \
    -Dmanpage-build=disabled

install -Dm644 "${COOKBOOK_SOURCE}/LICENSE.LGPL" "${COOKBOOK_STAGE}/usr/share/licenses/mpv/LICENSE.LGPL"
install -Dm644 "${COOKBOOK_SOURCE}/Copyright" "${COOKBOOK_STAGE}/usr/share/licenses/mpv/Copyright"
"""
