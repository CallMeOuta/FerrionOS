[package]
description = "When creating a customized FerrionOS image from FerrionOS build system, add files to this recipe to auto-install them in the FerrionOS \"user\" user directory"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/home/user"
cp -rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/home/user"
"""
