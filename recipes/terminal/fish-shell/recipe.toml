[package]
description = "Modern user-friendly terminal shell"

[source]
git = "https://github.com/fish-shell/fish-shell"
rev = "54e8ad7e90a8213c01ba58de0640223bee6846d6"
patches = ["redox.patch"]

[build]
template = "custom"
dependencies = ["gettext", "ncursesw", "pcre"]
script = """
DYNAMIC_INIT

# Without PREFIX, fish compiles in ~/.local/share/fish/install as its data
# directory, cannot find the scripts installed below and refuses to read its
# configuration.
export PREFIX=/usr SYSCONFDIR=/etc
# The default feature embed-data builds the scripts into the binary; they are
# installed as files below instead.
cookbook_cargo --no-default-features
mkdir -p "${COOKBOOK_STAGE}/usr/share/fish"
rsync -a "${COOKBOOK_SOURCE}/share/" "${COOKBOOK_STAGE}/usr/share/fish/"
"""
