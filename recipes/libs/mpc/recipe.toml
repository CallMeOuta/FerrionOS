[package]
description = "GNU library for arbitrary-precision complex math"


[source]
tar = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz"
blake3 = "86d083c43c08e98d4470c006a01e0df727c8ff56ddd2956b170566ba8c9a46de"
script = """
autotools_recursive_regenerate
"""

[build]
template = "custom"
compiler = "gcc"
dependencies = [
    "libgmp",
    "libmpfr",
]
script = """
DYNAMIC_STATIC_INIT
cookbook_configure
"""
