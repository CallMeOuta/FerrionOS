[package]
description = "OpenGL, EGL and GLES dispatch without X11"

[source]
# meson support not in latest release
git = "https://github.com/NVIDIA/libglvnd.git"
rev = "606f6627cf481ee6dcb32387edc010c502cdf38b"

[build]
template = "custom"
script = """
DYNAMIC_INIT
if [ "${COOKBOOK_DYNAMIC}" != "1" ]; then
    echo "libglvnd requires a target with dynamic linking (COOKBOOK_DYNAMIC=1)" >&2
    exit 1
fi
cookbook_meson -Dglx=disabled -Dx11=disabled -Dhgl=false
rm -f "${COOKBOOK_STAGE}/usr/include/glvnd/libglxabi.h"
"""
