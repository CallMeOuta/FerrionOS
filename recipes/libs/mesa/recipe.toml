[package]
description = "OpenGL and Vulkan CPU and GPU drivers, and also drivers for other Khronos Group standards"
dependencies = ["libvulkan"]

[source]
tar = "https://archive.mesa3d.org/mesa-26.3.1.tar.xz"
blake3 = "46527abb9520ae0a593c43e470c97909af5243b2cb646d9383b81d3131605431"
patches = [
    "ferrion-util.patch",
    "ferrion-drm-headers.patch",
    "ferrion-meson.patch",
    "ferrion-egl-platform.patch",
    "ferrion-orbital.patch",
    "ferrion-jit-diagnostic.patch",
    "ferrion-libsync-wait.patch",
    "ferrion-venus.patch",
    "ferrion-zink.patch",
    "ferrion-gbm.patch",
    "ferrion-wayland-clock.patch",
]

[build]
template = "custom"
dependencies = [
    "expat",
    "libdrm",
    "liborbital",
    "libwayland",
    "llvm21",
    "wayland-protocols",
    "zlib",
    "libglvnd",
]
dev-dependencies = [
    "host:glslang",
    "llvm21.dev",
    "venus-protocol",
]
script = """
DYNAMIC_INIT
if [ "${COOKBOOK_DYNAMIC}" != "1" ]; then
    echo "mesa requires a target with dynamic linking (COOKBOOK_DYNAMIC=1)" >&2
    exit 1
fi

#TODO: Should be CPPFLAGS but cookbook_meson isn't reading it
export CFLAGS+=" -DHAVE_PTHREAD=1 -I${COOKBOOK_SYSROOT}/include/libdrm"
export LLVM_CONFIG="${TARGET}-llvm-config"
export LDFLAGS+=" -lorbital"

cat > wayland_scanner_cross.txt <<EOF
[binaries]
wayland-scanner = 'wayland-scanner'
EOF
COOKBOOK_MESON_FLAGS+=(-Dshared-llvm=enabled -Degl=enabled -Dplatforms=redox,wayland -Dvulkan-drivers=swrast,virtio -Dvulkan-layers=device-select -Dglvnd=enabled --cross-file "${COOKBOOK_BUILD}/wayland_scanner_cross.txt")

cookbook_meson \
    -Ddri-drivers-path=/usr/lib/dri \
    -Dglx=disabled \
    -Dllvm=enabled \
    -Dshader-cache=disabled \
    -Dgallium-drivers=llvmpipe,softpipe,zink
"""
