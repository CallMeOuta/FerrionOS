[package]
description = "Building blocks for modern adaptive GTK 4 applications"

[source]
tar = "https://download.gnome.org/sources/libadwaita/1.8/libadwaita-1.8.4.tar.xz"
blake3 = "c3e10193a004499213bea52f093b759c9c15ca4c9734e6299a925cc832c883b9"

[build]
template = "custom"
dependencies = [
    "appstream",
    "fribidi",
    "glib",
    "gtk4",
]
script = """
DYNAMIC_INIT

cookbook_meson \
    --wrap-mode=nodownload \
    -Dauto_features=disabled \
    -Dintrospection=disabled \
    -Dvapi=false \
    -Ddocumentation=false \
    -Dtests=false \
    -Dexamples=false

install -Dm644 "${COOKBOOK_SOURCE}/COPYING" "${COOKBOOK_STAGE}/usr/share/licenses/libadwaita/COPYING"
"""
