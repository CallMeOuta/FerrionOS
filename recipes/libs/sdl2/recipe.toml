[package]
description = "Simple Directmedia Layer library (API version 2.x)"
dependencies = ["mesa"]

[source]
git = "https://gitlab.redox-os.org/redox-os/sdl2.git"
branch = "redox-2.0.33"
rev = "7e78d2d9683732a1dbc17f35f3047c55cf381a82"
shallow_clone = true
patches = ["ferrion-egl.patch"]

[build]
template = "cmake"
compiler = "no-lto"
dependencies = [
    "liborbital",
    "libglvnd",
    "zlib",
]
cmakeflags = [
    "-DSDL_VIDEO=1",
    "-DSDL_ORBITAL=1",
    "-DSDL_X11=OFF",
    "-DSDL_KMSDRM=OFF",
    "-DREDOX=1",
]
