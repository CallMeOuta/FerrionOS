[package]
description = "SSH and SFTP client: server and tools"

[source]
tar = "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.5p1.tar.gz"
blake3 = "60c9bdc9997dbd78d6011b4d52705fb9cd412104078020832c0f0154403615c1"
patches = [
    "redox.patch",
]
[build]
template = "custom"
dependencies = [
    "openssl3",
    "libldns",
    "libedit",
    "zlib",
    "zstd",
]
script = """
DYNAMIC_INIT
COOKBOOK_CONFIGURE_FLAGS+=(
    --disable-strip
    --with-ldns
    --with-libedit
    --sysconfdir=/etc/ssh
    --disable-utmpx
)
export CFLAGS+=" -DSYSTEMD_NOTIFY=1"
cookbook_configure
mv "${COOKBOOK_STAGE}"/usr/sbin/sshd "${COOKBOOK_STAGE}"/usr/bin/sshd
rmdir "${COOKBOOK_STAGE}"/usr/sbin


CONFIG_FILE="${COOKBOOK_STAGE}"/etc/ssh/sshd_config

sed -i "s/#AddressFamily any/AddressFamily inet/g" "${CONFIG_FILE}"
"""
