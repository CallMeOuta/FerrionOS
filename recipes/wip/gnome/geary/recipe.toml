[source]
tar = "https://download.gnome.org/sources/geary/46/geary-46.0.tar.xz"
[build]
template = "meson"
mesonflags = [
    "-Dprofile=release",
    "-Dlibunwind=disabled",
    "-Dtnef=disabled",
    "-Dvaladoc=disabled",
]
dependencies = [
    "gtk3",
    "webkitgtk3",
    "sqlite3",
]
dev-dependencies = ["host:vala"]
