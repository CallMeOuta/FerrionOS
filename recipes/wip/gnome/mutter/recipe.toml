[source]
tar = "https://download.gnome.org/sources/mutter/49/mutter-49.6.tar.xz"
[build]
template = "meson"
mesonflags = [
    "-Dopengl=false",
    "-Dgles2=false",
    "-Degl=false",
    "-Dwayland=true",
    "-Dx11=false",
    "-Dxwayland=false",
    "-Dlogind=false",
    "-Dudev=false",
    "-Dremote_desktop=false",
    "-Dlibgnome_desktop=false",
    "-Dlibwacom=false",
    "-Dsound_player=false",
    "-Dstartup_notification=false",
    "-Dintrospection=false",
    "-Dtests=disabled",
    "-Dprofiler=false",
    "-Dinstalled_tests=false",
    "-Dbash_completion=false",
    "-Ddevkit=disabled",
]
