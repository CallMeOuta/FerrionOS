[source]
git = "https://invent.kde.org/graphics/krita"
rev = "v6.0.2.1"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DLIMIT_LONG_TESTS=OFF",
    "-DENABLE_UPDATERS=OFF",
    "-DBUILD_WITH_QT6=ON",
    "-DALLOW_UNSTABLE=QT6",
]
dev-dependencies = ["host:ecm"]
dependencies = [
     "qt6-qt5compat",
     "qt6-base",
     "qt6-declarative",
     "qt6-svg",
     "kcompletion6",
     "kconfig6",
     "kcoreaddons6",
     "kguiaddons6",
     "ki18n6",
     "kitemviews6",
     "kwidgetsaddons6",
]
