[source]
tar = "https://github.com/keepassxreboot/keepassxc/releases/download/2.7.10/keepassxc-2.7.10-src.tar.xz"
[build]
template = "cmake"
cmakeflags = [
    "-DWITH_XC_AUTOTYPE=OFF",
    "-DWITH_XC_UPDATECHECK=OFF",
    "-DKEEPASSXC_BUILD_TYPE=Release",
    "-DWITH_APP_BUNDLE=OFF",
]
dependencies = [
    "qt5-base",
    "qt5-svg",
    "zlib",
    "libbotan",
    "libargon2",
    "readline",
]
