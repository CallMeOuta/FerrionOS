[source]
tar = "https://github.com/transmission/transmission/releases/download/4.0.6/transmission-4.0.6.tar.xz"
[build]
template = "cmake"
cmakeflags = [
    "-DENABLE_GTK=OFF",
    "-DENABLE_QT=OFF",
    "-DENABLE_CLI=ON",
    "-DINSTALL_WEB=OFF",
    "-DENABLE_TESTS=OFF",
    "-DINSTALL_DOC=OFF",
    "-DUSE_SYSTEM_DEFAULT=ON",
]
dependencies = [
    "curl",
    "miniupnpc",
]
