
[source]
git = "https://gitlab.redox-os.org/bpisch/espeak-ng.git"
branch = "redox"

[build]
template = "custom"
dependencies = ["libstdcxx"]
script = """
DYNAMIC_INIT
cp -R "${COOKBOOK_SOURCE}/espeak-ng-data" .
cookbook_cmake
cp -R "${COOKBOOK_SOURCE}/espeak-ng-data" "${COOKBOOK_STAGE}/usr/share/espeak-ng-data"
"""
