[source]
git = "https://github.com/linuxhw/hw-probe"
rev = "1.6"
shallow_clone = true
[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
cp -rv "${COOKBOOK_SOURCE}"/hw-probe.pl "${COOKBOOK_STAGE}/usr/bin/hw-probe"
chmod +x "${COOKBOOK_STAGE}"/usr/bin/hw-probe
"""
[package]
dependencies = [
    "perl5",
    "curl",
    "pciutils",
    "usbutils",
    "dmidecode",
]
