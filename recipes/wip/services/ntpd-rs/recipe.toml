[source]
git = "https://github.com/pendulum-project/ntpd-rs"
shallow_clone = true
[build]
template = "custom"
script = """
DYNAMIC_INIT
cookbook_cargo_packages ntpd
mkdir -pv "${COOKBOOK_STAGE}/etc/ntpd-rs"
cp -rv "${COOKBOOK_SOURCE}"/docs/examples/conf/ntp.toml.default "${COOKBOOK_STAGE}/etc/ntpd-rs/ntp.toml"
"""
