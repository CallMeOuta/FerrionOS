[source]
tar = "https://download.qt.io/official_releases/qt/5.15/5.15.18/single/qt-everywhere-opensource-src-5.15.18.tar.xz"
[build]
template = "configure"
configureflags = [
    "-no-opengl",
    "-no-feature-accessibility",
    "-no-xcb",
]
dependencies = [
    "fontconfig",
    "freetype2",
    "libxkbcommon",
    "glib",
    "gstreamer",
]
