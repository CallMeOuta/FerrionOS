[source]
tar = "https://download.qt.io/official_releases/qt/6.10/6.10.0/single/qt-everywhere-src-6.10.0.tar.xz"
[build]
template = "custom"
dependencies = [
    "fontconfig",
    "freetype2",
    "libxkbcommon",
    "glib",
    "gstreamer",
    "openssl3",
]
script = """
DYNAMIC_INIT
COOKBOOK_CONFIGURE_FLAGS+=(
    -no-opengl
    -no-feature-accessibility
    -openssl-linked
    -no-xcb
)
cookbook_configure
cookbook_cmake
"""
