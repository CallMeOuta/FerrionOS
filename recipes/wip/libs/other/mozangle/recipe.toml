#TODO verify current state
[source]
git = "https://gitlab.redox-os.org/njskalski/mozangle.git"
branch = "redox_mods"
shallow_clone = true
[build]
template = "custom"
dependencies = [
    "freetype2",
    "gettext",
    "glib",
    "gstreamer",
    "harfbuzz",
    "libffi",
    "libiconv",
    "libpng",
    "openssl3",
    "pcre",
    "zlib",

    "libpthread-stubs",
    "fontconfig",
    "expat",
    "relibc",
    "gcc13",
]

script = """
    export TARGET=${TARGET}
    export TARGET_CC=${TARGET}-gcc
    export TARGET_CXX=${TARGET}-g++
    export TARGET_AR=${TARGET}-ar

    rsync -a --delete "${COOKBOOK_SOURCE}/" ./
    cargo build --release --target ${TARGET}
"""
