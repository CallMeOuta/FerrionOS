[source]
tar = "https://github.com/nigels-com/glew/releases/download/glew-2.3.1/glew-2.3.1.tgz"
[build]
template = "custom"
dependencies = [
    "mesa",
    "mesa-glu",
]
script = """
DYNAMIC_INIT
COOKBOOK_CMAKE_FLAGS+=(
    -DOPENGL_opengl_LIBRARY="/dev/null"
    -DOPENGL_glx_LIBRARY="/dev/null"
    -DBUILD_UTILS=OFF
    -DGLEW_EGL=ON
    -DGLEW_X11=OFF
)
cookbook_cmake "${COOKBOOK_SOURCE}"/build/cmake
"""
