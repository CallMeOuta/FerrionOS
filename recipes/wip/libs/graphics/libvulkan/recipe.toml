#TODO compiled but not tested
# The Khronos Vulkan loader (libvulkan.so.1), which finds Mesa's lavapipe through
# /usr/share/vulkan/icd.d. No window-system support: Orbital has no Vulkan surface.
# build instructions: https://github.com/KhronosGroup/Vulkan-Loader/blob/main/BUILD.md
[source]
git = "https://github.com/KhronosGroup/Vulkan-Loader"
rev = "vulkan-sdk-1.4.350.1"
shallow_clone = true
patches = ["ferrion-redox-platform.patch"]

[build]
template = "cmake"
dependencies = [
    "vulkan-headers",
]
cmakeflags = [
    "-DBUILD_TESTS=OFF",
    "-DUPDATE_DEPS=OFF",
]
