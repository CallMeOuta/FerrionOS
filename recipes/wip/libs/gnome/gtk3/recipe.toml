#TODO promote
[source]
git = "https://gitlab.redox-os.org/redox-os/gtk"
branch = "redox-3.24.43"
rev = "401ce6cc09b6527cd6057454d8acf856eb454ab0"
shallow_clone = true
patches = ["ferrion-mount-lookup.patch"]

[build]
dependencies = [
    "atk",
    "cairo",
    "expat",
    "fontconfig",
    "freetype2",
    "fribidi",
    "gdk-pixbuf",
    "gettext",
    "glib",
    #TODO "gobject-introspection",
    "harfbuzz",
    "libepoxy",
    "libffi",
    "libiconv",
    "libjpeg",
    "liborbital",
    "libpng",
    "libxkbcommon",
    "libwayland",
    "mesa",
    "pango",
    "pcre2",
    "pixman",
    "wayland-protocols",
    "zlib",
]
template = "custom"
script = """
DYNAMIC_INIT
CFLAGS="${CFLAGS} -DM_SQRT2=1.41421356237309504880"

if [ "${COOKBOOK_DYNAMIC}" != "1" ]; then
    COOKBOOK_MESON_FLAGS+=(-Dwayland_backend=false)
fi

cookbook_meson \
    -Dexamples=false \
    -Dx11_backend=false \
    -Dintrospection=false \
    -Dtests=false
"""

[package]
dependencies = [
    "librsvg",
]
