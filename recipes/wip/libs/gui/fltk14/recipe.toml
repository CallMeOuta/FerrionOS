# build instructions: https://github.com/fltk/fltk/blob/master/README.Unix.txt
# commented out dependencies are optional but recommended, needs to be determined
[source]
tar = "https://github.com/fltk/fltk/releases/download/release-1.4.4/fltk-1.4.4-source.tar.bz2"
[build]
template = "configure"
configureflags = [
    "--disable-x11",
]
dependencies = [
    "cairo",
    "dbus",
    "libwayland",
    "libxkbcommon",
    "mesa-glu",
    "pango",
    "wayland-protocols",
    #"freeglut",
    #"fontconfig",
    #"glew",
    #"libalsa",
    #"libjpeg",
    #"libpng",
]
