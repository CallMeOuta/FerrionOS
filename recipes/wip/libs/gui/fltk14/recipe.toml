[source]
tar = "https://github.com/fltk/fltk/releases/download/release-1.4.4/fltk-1.4.4-source.tar.bz2"
[build]
template = "configure"
configureflags = [
    "--disable-x11",
]
dependencies = [
    "cairo",
    "dbus",
    "libwayland",
    "libxkbcommon",
    "mesa-glu",
    "pango",
    "wayland-protocols",
]
