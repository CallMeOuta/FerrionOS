[source]
git = "https://invent.kde.org/plasma/libplasma"
rev = "v6.6.5"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DENABLE_ACTIVITIES=OFF",
    "-DWITHOUT_X11=ON",
]
dev-dependencies = ["host:ecm"]
dependencies = [
    "qt6-base",
    "kconfig6",
    "kcoreaddons6",
    "kguiaddons6",
    "ki18n6",
    "kiconthemes6",
    "kio6",
    "kwindowsystem6",
    "knotifications6",
    "kpackage6",
    "kirigami6",
    "ksvg6",
    "kcolorscheme6",
    "kglobalaccel6",
]
