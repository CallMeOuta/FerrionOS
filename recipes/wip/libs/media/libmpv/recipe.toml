[source]
git = "https://github.com/mpv-player/mpv"
branch = "release/0.41"
shallow_clone = true
[build]
template = "meson"
mesonflags = [
    "-Dcplayer=false",
    "-Dx11=disabled",
    "-Dwayland=disabled",
    "-Dmanpage-build=disabled",
]
dependencies = [
    "ffmpeg6",
    "libass",
    "sdl2",
]
