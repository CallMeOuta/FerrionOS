[source]
tar = "https://github.com/AcademySoftwareFoundation/OpenImageIO/releases/download/v3.1.11.0/OpenImageIO-3.1.11.0.tar.gz"
[build]
template = "cmake"
cmakeflags = [
    "-DBUILD_DOCS=OFF",
    "-DOIIO_BUILD_TESTS=OFF",
]
dependencies = [
    "libimath",
    "libtiff",
    "libjpeg",
    "openexr",
    "zlib",
    "python312",
    "libfmt",
]
