[source]
git = "https://github.com/alacritty/alacritty"
shallow_clone = true
[build]
template = "cargo"
dependencies = [
    "freetype2",
    "fontconfig",
    "libwayland",
    "libxkbcommon",
]
cargopath = "alacritty"
cargoflags = [
    "--no-default-features",
    "--features wayland",
]
