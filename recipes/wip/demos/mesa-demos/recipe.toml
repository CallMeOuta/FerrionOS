[source]
tar = "https://archive.mesa3d.org/demos/mesa-demos-9.0.0.tar.xz"
patches = [
    "redox.patch"
]
[build]
template = "meson"
mesonflags = [
    "-Dx11=disabled",
]
dependencies = [
    "freeglut",
    "mesa",
    "wayland-protocols",
    "libdecor",
]
dev-dependencies = [
    "libstdcxx",
]

[package]
description = "Mesa demos (wayland only)"
