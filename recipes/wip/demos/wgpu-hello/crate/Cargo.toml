[package]
name = "wgpu-hello"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Smallest wgpu check for FerrionOS: a triangle rendered headless to a PNG, and in a winit window"
publish = false

[[bin]]
name = "wgpu-hello-headless"
path = "src/headless.rs"

[[bin]]
name = "wgpu-hello-window"
path = "src/window.rs"

[dependencies]
png = "0.18"
pollster = "0.4"
softbuffer = { version = "0.4", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
softbuffer = { version = "0.4", default-features = false, features = ["wayland", "wayland-dlopen"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen"] }

[profile.release]
debug = false
