[source]
tar = "https://github.com/flightlessmango/MangoHud/releases/download/v0.8.1/MangoHud-v0.8.1-Source.tar.xz"
[build]
template = "meson"
mesonflags = [
    "-Dwith_xnvctrl=disabled",
    "-Dwith_dbus=disabled",
    "-Dwith_wayland=enabled",
    "-Dwith_x11=disabled",
]
dependencies = [
    "mesa",
    "libwayland",
    "libxkbcommon",
]
