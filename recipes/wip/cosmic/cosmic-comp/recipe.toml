[source]
git = "https://github.com/jackpot51/cosmic-comp"
branch = "redox"
rev = "5ac722366ea21dc3218a137f9d5893439f2082db"
shallow_clone = true
patches = ["ferrion-vendor-winit.patch", "ferrion-no-x11.patch"]
script = """
winit_rev=a3d6894a25b1a29f481c6a0f765df35ae36eaf46
winit_patch="${COOKBOOK_ROOT}/recipes/wip/cosmic/cosmic-comp/ferrion-winit-orbital-scancode.patch"
echo "31e76d0834e5181ce3c53ba530b3b5d6dd274cedec597cf32b2892b4fe580aa0  ${winit_patch}" | sha256sum --check --quiet -
rm -rf vendor/winit
mkdir -p vendor/winit
git -C vendor/winit init --quiet
git -C vendor/winit fetch --quiet --depth 1 https://github.com/jackpot51/winit.git "${winit_rev}"
git -C vendor/winit checkout --quiet FETCH_HEAD
test "$(git -C vendor/winit rev-parse HEAD)" = "${winit_rev}"
rm -rf vendor/winit/.git
patch --directory=vendor/winit --strip=1 < "${winit_patch}"
"""
[build]
template = "custom"
dependencies = [
    "libffi",
    "libwayland",
    "libxkbcommon",
    "mesa",
    "pixman",
    "seatd",
]
script = """
DYNAMIC_INIT
cookbook_cargo --no-default-features --config 'profile.release.lto = "thin"'
"""
