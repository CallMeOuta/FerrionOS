[source]
git = "https://github.com/qgis/QGIS"
rev = "final-4_0_3"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DWITH_GUI=FALSE",
    "-DWITH_3D=FALSE",
    "-DWITH_QTPOSITIONING=FALSE",
    "-DUSE_PRECOMPILED_HEADERS=OFF",
    "-DENABLE_TESTS=FALSE",
]
dependencies = [
    "sqlite3",
    "expat",
    "libzip",
    "protobuf",
    "geos",
]
