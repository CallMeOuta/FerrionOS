[source]
tar = "https://github.com/CelestiaProject/Celestia/releases/download/1.6.4/celestia-1.6.4.tar.xz"
[build]
template = "cmake"
cmakeflags = [
    "-DENABLE_INTERFACE=ON",
    "-DENABLE_SDL=ON",
]
dependencies = [
    "mesa",
    "mesa-glu",
    "sdl2",
    "libepoxy",
    "libeigen",
    "libfmt",
    "freetype2",
    "libpng",
    "libjpeg",
    "luajit",
]
