# Host-only shader compiler for Mesa; not installed in an OS image.
# build instructions: https://github.com/KhronosGroup/glslang#building-cmake
[source]
git = "https://github.com/KhronosGroup/glslang"
# Release 16.0.0
rev = "a57276bf558f5cf94d3a9854ebdf5a2236849a5a"
shallow_clone = true
[build]
template = "custom"
script = """
if [ "${TARGET}" != "${COOKBOOK_HOST_TARGET}" ]; then
    echo "glslang is a host-only build tool; cook host:glslang" >&2
    exit 1
fi

generate_cookbook_cmake_file "${GNU_TARGET}" "" "${COOKBOOK_SYSROOT}" native.cmake
"${COOKBOOK_CMAKE}" "${COOKBOOK_SOURCE}" -GNinja \
    -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=native.cmake \
    -DBUILD_SHARED_LIBS=OFF -DBUILD_EXTERNAL=OFF -DGLSLANG_TESTS=OFF \
    -DENABLE_GLSLANG_BINARIES=ON -DENABLE_SPIRV=ON -DENABLE_HLSL=OFF \
    -DENABLE_OPT=OFF -DGLSLANG_ENABLE_INSTALL=OFF
"${COOKBOOK_NINJA}" -j"${COOKBOOK_MAKE_JOBS}" glslang-standalone
mkdir -p "${COOKBOOK_STAGE}/usr/bin"
cp StandAlone/glslang "${COOKBOOK_STAGE}/usr/bin/glslangValidator"
"${COOKBOOK_STAGE}/usr/bin/glslangValidator" --version
"""
