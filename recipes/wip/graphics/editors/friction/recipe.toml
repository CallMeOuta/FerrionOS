[source]
tar = "https://github.com/friction2d/friction/releases/download/v1.0.0-rc.3/friction-1.0.0-rc.3.tar.xz"
[build]
template = "cmake"
cmakeflags = [
    "-DBUILD_SKIA=OFF"
]
dependencies = [
    "ffmpeg6",
    "libunwind",
    "expat",
    "freetype2",
    "fontconfig",
    "libpng",
    "libwebp",
    "zlib",
    "qt5-base",
    "qt5-3d",
    "qt5-multimedia",
    "qscintilla",
]
