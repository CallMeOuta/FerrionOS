[source]
git = "https://github.com/jackpot51/wayland-rs"
branch = "redox"
rev = "eb316399a4d8747ba27b5dce221a3bd04bf666e2"
shallow_clone = true
[build]
template = "custom"
dependencies = [
    "libffi",
    "libwayland",
]
script = """
DYNAMIC_INIT
export "${REDOXER_RUSTFLAGS_KEY}=${!REDOXER_RUSTFLAGS_KEY} -lffi"
cookbook_cargo_examples list_globals_no_dispatch list_globals simple_window
"""
