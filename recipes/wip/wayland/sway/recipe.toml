[source]
tar = "https://github.com/swaywm/sway/releases/download/1.12/sway-1.12.tar.gz"

[build]
template = "meson"
mesonflags = [
    "-Dman-pages=disabled",
    "-Dtray=disabled",
    "-Dswaynag=false",
    "-Dgdk-pixbuf=disabled",
    "-Dxwayland=disabled",
]
dependencies = [
    "cairo",
    "expat",
    "fontconfig",
    "freetype2",
    "fribidi",
    "gdk-pixbuf",
    "glib",
    "harfbuzz",
    "json-c",
    "libdrm",
    "libffi",
    "libjpeg",
    "libpng",
    "libpthread-stubs",
    "libwayland",
    "libxkbcommon",
    "pango",
    "pcre2",
    "pixman",
    "shared-mime-info",
    "wayland-protocols",
    "wlroots",
    "zlib",
]
