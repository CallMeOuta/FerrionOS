[source]
git = "https://github.com/86Box/86Box"
rev = "v5.3"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DRELEASE=ON",
    "-DQT=OFF",
    "-DDISCORD=OFF",
    "-DOPENAL=OFF",
    "-DRTMIDI=OFF",
    "-DFLUIDSYNTH=OFF",
    "-DVNC=OFF",
    "-DSOUNDCANVAS=OFF",
    "-DMUNT=OFF",
]
dependencies = [
    "freetype2",
    "libpng",
    "libslirp",
    "libsndfile",
    "sdl2",
    "faudio",
]
