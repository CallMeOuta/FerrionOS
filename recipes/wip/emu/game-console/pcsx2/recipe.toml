[source]
git = "https://github.com/PCSX2/pcsx2"
rev = "v2.6.3"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
    "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON",
    "-DENABLE_TESTS=OFF",
    "-DPACKAGE_MODE=ON",
    "-DUSE_OPENGL=OFF",
    "-DUSE_VULKAN=OFF",
    "-DX11_API=OFF",
    "-DWAYLAND_API=OFF",
    "-DUSE_BACKTRACE=OFF",
    "-DENABLE_QT_UI=OFF",
    "-DENABLE_GSRUNNER=ON",
]
