[source]
tar = "https://github.com/hrydgard/ppsspp/releases/download/v1.19.3/ppsspp-1.19.3.tar.xz"
[build]
template = "custom"
dependencies = [
    "mesa",
    "mesa-glu",
    "sdl2",
    "sdl2-ttf",
    "zlib",
    "glew",
    "fontconfig",
    "curl",
]
script = """
DYNAMIC_INIT
COOKBOOK_CMAKE_FLAGS+=(
    -DOPENGL_opengl_LIBRARY="/dev/null"
    -DOPENGL_glx_LIBRARY="/dev/null"
    -DUSE_DISCORD=OFF
    -DUSE_FFMPEG=OFF
    -DUSE_MINIUPNPC=OFF
    -DUSE_SYSTEM_LIBSDL2=ON
    -DUSING_EGL=OFF
    -DUSING_FBDEV=OFF
    -DUSING_GLES2=OFF
    -DUSING_X11_VULKAN=OFF
    -DUNIX=ON
)
cookbook_cmake
"""
