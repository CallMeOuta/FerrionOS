[source]
git = "https://github.com/azahar-emu/azahar"
rev = "2123.3"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DUSE_SYSTEM_SDL2=ON",
    "-DENABLE_QT=OFF",
    "-DENABLE_TESTS=OFF",
    "-DENABLE_WEB_SERVICE=OFF",
    "-DENABLE_SCRIPTING=OFF",
    "-DENABLE_LIBUSB=OFF",
    "-DENABLE_VULKAN=OFF",
    "-DCITRA_USE_PRECOMPILED_HEADERS=OFF"
]
dependencies = [
    "sdl2",
]
