[source]
git = "https://github.com/RPCS3/rpcs3"
rev = "e32d19ffac500c6194f93b0338a4a64c51399b38"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DUSE_NATIVE_INSTRUCTIONS=OFF",
    "-DWITH_LLVM=OFF",
    "-DUSE_ALSA=OFF",
    "-DUSE_PULSE=OFF",
    "-DUSE_LIBEVDEV=OFF",
    "-DBUILD_LLVM_SUBMODULE=OFF",
    "-DUSE_SYSTEM_FFMPEG=ON",
    "-DUSE_VULKAN=OFF",
    "-DUSE_FAUDIO=OFF",
    "-DUSE_SYSTEM_OPENAL=ON",
    "-DUSE_SYSTEM_ZSTD=ON",
]
dependencies = [
    "qt6-base",
    "qt6-multimedia",
    "qt6-svg",
    "qt6-declarative",
    "curl",
    "opencv4",
    "sdl3",
    "openal",
    "zlib",
    "zstd",
]
