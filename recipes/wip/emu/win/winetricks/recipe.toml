[source]
git = "https://github.com/Winetricks/winetricks"
rev = "20260125"
shallow_clone = true
[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/bin"
cp -rv "${COOKBOOK_SOURCE}"/src/winetricks "${COOKBOOK_STAGE}/usr/bin"
"""
[package]
dependencies = [
    "dash",
    "wget",
    "xz",
    "cabextract",
    "unzip-rs",
    "7zip",
    "zenity",
]
