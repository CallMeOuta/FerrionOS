[package]
name = "ferrion-netd"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
daemon = { path = "../../../../components/base/daemon" }
ioslice = "0.6.0"
libc = "0.2.181"
libredox = { version = "0.2.0", features = ["mkns"] }
redox-scheme = { git = "https://gitlab.redox-os.org/redox-os/redox-scheme.git", default-features = false }
redox_syscall = { version = "0.9.5", features = ["std"] }
scheme-utils = { path = "../../../../components/base/scheme-utils" }
serde_json = "1"
