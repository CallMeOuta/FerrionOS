[package]
name = "ferrion-run"
description = "FerrionOS program launcher: scoped sessions that hold only the folders they are given"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "ferrion-run"
path = "src/bin/ferrion-run.rs"

[[bin]]
name = "ferrion-run-probe"
path = "src/bin/ferrion-run-probe.rs"

[dependencies]
ferrion-scope = { path = "../../ferrion-scope/crate" }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "redox")'.dependencies]
libredox = { version = "0.2.0", features = ["mkns"] }
ioslice = "0.6"
redox_syscall = { version = "0.9.5", features = ["std"] }
