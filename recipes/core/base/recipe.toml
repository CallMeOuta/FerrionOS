[package]
description = "Essential system components for FerrionOS"

[source]
path = "../../../components/base"

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
dev-dependencies = [
  "relibc",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""

[[optional-packages]]
name = "initfs"
files = ["usr/lib/initfs/**"]
