[package]
description = "Essential system components and drivers for FerrionOS"

[source]
git = "https://gitlab.redox-os.org/redox-os/base.git"
rev = "20f7573b4dc011ea5267189185edc0b2f12bab0f"
patches = ["ferrion-boot-splash.patch", "ferrion-lockdown.patch", "ferrion-pty-hangup.patch", "ferrion-live-disk-view.patch", "ferrion-rand-seed.patch"]

[build]
template = "custom"
dependencies = [
  "redoxfs",
]
script = """
cd "${COOKBOOK_SOURCE}" && make install-base \
    SRC_DIR="${COOKBOOK_SOURCE}" SYSROOT="${COOKBOOK_SYSROOT}" \
    LINKER="${GNU_TARGET}-ld" CARGO="${COOKBOOK_CARGO}" \
    BUILD_DIR="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""
