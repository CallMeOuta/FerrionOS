[package]
description = "Daemon used for profiling kernel (requires profiling-kernel recipe)"

[source]
git = "https://gitlab.redox-os.org/redox-os/profiled.git"
rev = "1c3a42e197fe504d761b427c120c103e102c7eac"

[build]
template = "custom"
script = """
cookbook_cargo

mkdir -p "${COOKBOOK_STAGE}/usr/lib/init.d"
cp "${COOKBOOK_SOURCE}/init.d/"* "${COOKBOOK_STAGE}/usr/lib/init.d/"
"""
