[package]
name = "ferrion-wm-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Inputd and CPU DRM backend for the FerrionOS compositor"

[features]
default = []
smithay = ["dep:smithay"]

[dependencies]
smithay = { git = "https://github.com/jackpot51/smithay", rev = "13488e2fc469841763495f89db832429534d82f5", default-features = false, optional = true }

[target.'cfg(target_os = "redox")'.dependencies]
drm = "0.15.0"
drm-ffi = "0.9.1"
graphics-ipc = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "20f7573b4dc011ea5267189185edc0b2f12bab0f" }
inputd = { git = "https://gitlab.redox-os.org/redox-os/base.git", rev = "20f7573b4dc011ea5267189185edc0b2f12bab0f" }
libc = "0.2"
libredox = "0.1.18"
